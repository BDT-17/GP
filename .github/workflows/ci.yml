name: MASCOT CI Pipeline

on:
  push:
    branches: ["thangbd/dev", "main", "quoc-anh"]
  pull_request:
    branches: ["thangbd/dev", "main"]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8 (Syntax & Undefined Names)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report Style Findings
        run: |
          # Report style findings without failing the build
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest with Coverage
        run: |
          python -m pytest -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "### 🚀 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All unit and integration tests executed.**" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suite:** \`tests/\` (Curriculum Gate, Orchestrator, Web API)" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Python 3.10 (Ubuntu Latest)" >> $GITHUB_STEP_SUMMARY

