services:
  mascot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mascot-classroom
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/session').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

